{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1>My Profile</h1>
        <p>View and update your details.</p>
    </div>
</div>
<div class="form-card wide">
    <form method="post">
        <div class="form-group">
            <label>Name</label>
            <input type="text" value="{{ student.name }}" disabled>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ student.email or '' }}">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" value="{{ student.phone or '' }}">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="Male" {{ 'selected' if student.gender == 'Male' }}>Male</option>
                    <option value="Female" {{ 'selected' if student.gender == 'Female' }}>Female</option>
                    <option value="Other" {{ 'selected' if student.gender == 'Other' }}>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ student.address or '' }}">
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock %}
